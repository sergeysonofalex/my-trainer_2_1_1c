<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Дерево успеха — рефлексия</title>
<style>
  :root{
    --red1:#ff9a9a;   --red2:#e63946;
    --green1:#b6ea7a; --green2:#48a83f;
    --yellow1:#ffe98a;--yellow2:#eaa72a;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{
    font-family: 'Segoe UI', system-ui, -apple-system, Roboto, Arial, sans-serif;
    background:linear-gradient(180deg,#8fdcff 0%,#c4ecff 40%,#e6f9d9 70%,#c3ec9a 100%);
    display:flex; flex-direction:column; overflow:hidden;
    user-select:none; -webkit-user-select:none;
    touch-action:manipulation; -webkit-tap-highlight-color:transparent;
  }

  /* ---------- Заголовок ---------- */
  header{ padding:10px 10px 0; flex:0 0 auto; }
  h1{
    margin:0; text-align:center;
    font-size:clamp(22px,4vw,46px);
    font-weight:800;
    color:#1e5b2c;
    text-shadow:0 2px 0 #ffffff, 0 6px 18px rgba(0,0,0,.18);
    letter-spacing:.3px;
    line-height:1.25;
  }

  /* ---------- Дерево ---------- */
  main{
    flex:1 1 auto; min-height:0;
    display:flex; align-items:center; justify-content:center;
    padding:0 8px;
  }
  #tree{ width:100%; height:100%; display:block; }

  /* ---------- Кнопки выбора ---------- */
  .choices{
    flex:0 0 auto;
    display:flex; justify-content:center; align-items:flex-start;
    gap:clamp(10px,2vw,32px);
    padding:10px 12px 12px;
    flex-wrap:wrap;
  }
  .choice{ display:flex; flex-direction:column; align-items:center; gap:8px; }

  .vote-btn{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:6px;
    width:clamp(160px,26vw,300px);
    padding:clamp(12px,1.8vh,22px) 14px;
    border:none; border-radius:26px;
    font-family:inherit; font-weight:800;
    font-size:clamp(14px,1.6vw,22px);
    line-height:1.3; text-align:center;
    cursor:pointer; color:#fff;
    text-shadow:0 2px 4px rgba(0,0,0,.35);
    box-shadow:0 8px 0 rgba(0,0,0,.20), 0 12px 24px rgba(0,0,0,.18);
    transition:transform .12s ease, box-shadow .12s ease, filter .15s ease;
  }
  .vote-btn .emoji{
    font-size:clamp(36px,5.5vw,64px);
    line-height:1;
    filter:drop-shadow(0 4px 4px rgba(0,0,0,.28));
  }
  .vote-btn:active{ transform:translateY(6px); box-shadow:0 2px 0 rgba(0,0,0,.20), 0 6px 12px rgba(0,0,0,.18); }
  .vote-btn:hover{ filter:brightness(1.06); }

  .vote-btn.red   { background:linear-gradient(180deg,var(--red1),var(--red2)); }
  .vote-btn.green { background:linear-gradient(180deg,var(--green1),var(--green2)); color:#123d08; text-shadow:0 2px 4px rgba(255,255,255,.5); }
  .vote-btn.yellow{ background:linear-gradient(180deg,var(--yellow1),var(--yellow2)); color:#5a3a00; text-shadow:0 2px 4px rgba(255,255,255,.5); }

  .counter{
    background:rgba(255,255,255,.95);
    border-radius:999px;
    padding:5px 18px;
    font-size:clamp(14px,1.5vw,20px);
    font-weight:700;
    color:#2b4a12;
    box-shadow:0 4px 10px rgba(0,0,0,.15), inset 0 -2px 0 rgba(0,0,0,.06);
    white-space:nowrap;
  }
  .counter .num{
    display:inline-block;
    color:#e05a00;
    font-size:1.3em;
    transition:transform .18s ease;
  }
  .counter .num.bump{ transform:scale(1.7); }

  /* ---------- Нижняя панель ---------- */
  footer{
    flex:0 0 auto;
    display:flex; justify-content:center;
    padding:4px 10px calc(12px + env(safe-area-inset-bottom,0px));
  }
  #reset{
    font-family:inherit;
    font-size:clamp(14px,1.5vw,20px);
    font-weight:700;
    color:#2f4f2f;
    background:rgba(255,255,255,.9);
    border:2px solid rgba(255,255,255,.95);
    border-radius:999px;
    padding:10px 28px;
    cursor:pointer;
    box-shadow:0 6px 16px rgba(0,0,0,.16);
    transition:transform .12s ease, background .15s ease;
  }
  #reset:hover{ background:#fff; }
  #reset:active{ transform:scale(.96); }

  /* ---------- Летящий плод и звёздочки ---------- */
  .flyer{
    position:fixed; z-index:9000; pointer-events:none;
    font-size:clamp(34px,5.5vw,58px); line-height:1;
    transform:translate(-50%,-50%) scale(1.25);
    transition:transform .68s cubic-bezier(.34,.02,.4,1);
    will-change:transform;
    filter:drop-shadow(0 6px 8px rgba(0,0,0,.28));
  }
  .star{
    position:fixed; z-index:9500; pointer-events:none;
    font-size:clamp(16px,2.4vw,28px); line-height:1;
    transform:translate(-50%,-50%) scale(.4);
    opacity:1;
    transition:transform .95s cubic-bezier(.15,.7,.4,1), opacity .95s ease-out;
    will-change:transform,opacity;
  }

  /* ---------- Анимация появления плода ---------- */
  .fruit-pop{
    animation:pop .5s cubic-bezier(.2,1.75,.4,1) both;
    transform-box:fill-box;
    transform-origin:center;
  }
  @keyframes pop{
    from{ transform:scale(0) rotate(-45deg); }
    to  { transform:scale(1) rotate(0deg); }
  }

  @media (max-height:560px){
    h1{ font-size:clamp(18px,3vw,30px); }
    .vote-btn .emoji{ font-size:clamp(28px,4vw,40px); }
    .vote-btn{ padding:8px 10px; }
    .counter{ padding:3px 12px; font-size:clamp(12px,1.3vw,16px); }
  }
</style>
</head>
<body>

<header>
  <h1>Оцени свои успехи на уроке!</h1>
</header>

<main>
  <svg id="tree" viewBox="0 0 620 520" preserveAspectRatio="xMidYMid meet" aria-label="Сказочное дерево успеха">
    <defs>
      <radialGradient id="crownGrad" cx="50%" cy="50%" r="50%">
        <stop offset="0%"   stop-color="#b6ea7a" stop-opacity="0.75"/>
        <stop offset="60%"  stop-color="#9ade63" stop-opacity="0.42"/>
        <stop offset="100%" stop-color="#9ade63" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="trunkGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%"   stop-color="#9c6231"/>
        <stop offset="45%"  stop-color="#b9793f"/>
        <stop offset="100%" stop-color="#8a5426"/>
      </linearGradient>
      <linearGradient id="hillGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"   stop-color="#a5e26b"/>
        <stop offset="100%" stop-color="#6bbf42"/>
      </linearGradient>
      <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
        <stop offset="0%"   stop-color="#fff6b8"/>
        <stop offset="60%"  stop-color="#ffe066"/>
        <stop offset="100%" stop-color="#ffd12e" stop-opacity="0"/>
      </radialGradient>
    </defs>

    <!-- Солнышко и облака -->
    <circle cx="78" cy="72" r="62" fill="url(#sunGrad)"/>
    <circle cx="78" cy="72" r="30" fill="#ffe066" opacity="0.95"/>

    <g fill="#ffffff" opacity="0.85">
      <ellipse cx="500" cy="70" rx="46" ry="24"/>
      <ellipse cx="545" cy="76" rx="34" ry="19"/>
      <ellipse cx="466" cy="80" rx="30" ry="17"/>
      <ellipse cx="180" cy="44" rx="34" ry="17"/>
      <ellipse cx="212" cy="48" rx="26" ry="14"/>
    </g>

    <!-- Крона (мягкое зелёное облако) -->
    <ellipse cx="310" cy="235" rx="215" ry="175" fill="url(#crownGrad)"/>

    <!-- Ствол -->
    <path d="M280 508 C 288 440, 296 390, 298 335 L322 335 C 324 390, 332 440, 340 508 Z"
          fill="url(#trunkGrad)" stroke="#7a4a1e" stroke-width="2" stroke-linejoin="round"/>

    <!-- Ветки -->
    <g fill="none" stroke="url(#trunkGrad)" stroke-linecap="round" stroke-linejoin="round">
      <path d="M305 370 C 250 350, 190 315, 140 250" stroke-width="20"/>
      <path d="M200 318 C 165 300, 140 285, 118 262" stroke-width="11"/>
      <path d="M305 420 C 270 415, 240 405, 212 392" stroke-width="10"/>

      <path d="M315 365 C 370 345, 425 310, 480 245" stroke-width="20"/>
      <path d="M415 308 C 445 295, 475 285, 505 268" stroke-width="11"/>
      <path d="M315 420 C 350 415, 380 405, 408 392" stroke-width="10"/>

      <path d="M310 345 C 308 300, 306 250, 305 185" stroke-width="16"/>
      <path d="M307 250 C 280 225, 245 200, 215 178" stroke-width="11"/>
      <path d="M306 235 C 335 210, 365 190, 395 168" stroke-width="11"/>
      <path d="M305 190 C 300 170, 300 155, 302 140" stroke-width="8"/>
    </g>

    <!-- Холм -->
    <path d="M-10 522 Q 310 468 630 522 Z" fill="url(#hillGrad)"/>
    <path d="M-10 522 Q 310 468 630 522" fill="none" stroke="#5aa838" stroke-width="3" opacity="0.5"/>

    <!-- Сюда «садятся» плоды -->
    <g id="fruits"></g>
  </svg>
</main>

<!-- Кнопки голосования -->
<div class="choices">
  <div class="choice">
    <button class="vote-btn red" data-type="red">
      <span class="emoji">🍎</span>
      <span class="label">Я всё понял и могу научить друга!</span>
    </button>
    <div class="counter" id="counter-red"><span class="num">0</span> <span class="word">учеников</span></div>
  </div>

  <div class="choice">
    <button class="vote-btn green" data-type="green">
      <span class="emoji">🍏</span>
      <span class="label">Я всё понял, но есть вопросы.</span>
    </button>
    <div class="counter" id="counter-green"><span class="num">0</span> <span class="word">учеников</span></div>
  </div>

  <div class="choice">
    <button class="vote-btn yellow" data-type="yellow">
      <span class="emoji">🍂</span>
      <span class="label">Мне было трудно, нужна помощь!</span>
    </button>
    <div class="counter" id="counter-yellow"><span class="num">0</span> <span class="word">учеников</span></div>
  </div>
</div>

<footer>
  <button id="reset">↺ Сбросить результаты</button>
</footer>

<script>
(function(){
  "use strict";

  /* ============ Основные ссылки ============ */
  const NS = "http://www.w3.org/2000/svg";
  const svg        = document.getElementById("tree");
  const fruitsG    = document.getElementById("fruits");

  const EMOJI = { red:"🍎", green:"🍏", yellow:"🍂" };
  const COUNTERS = {
    red:    document.getElementById("counter-red"),
    green:  document.getElementById("counter-green"),
    yellow: document.getElementById("counter-yellow")
  };

  /* ============ Точки на ветках, куда садятся плоды ============ */
  const SLOTS = [
    // левая большая ветка
    {x:250,y:352},{x:205,y:326},{x:168,y:292},{x:140,y:256},
    // левая верхняя веточка
    {x:155,y:294},{x:118,y:268},
    // левая нижняя веточка
    {x:255,y:412},{x:212,y:398},
    // правая большая ветка
    {x:368,y:351},{x:420,y:317},{x:462,y:284},{x:480,y:252},
    // правая верхняя веточка
    {x:458,y:296},{x:505,y:274},
    // правая нижняя веточка
    {x:358,y:412},{x:408,y:398},
    // центральный ствол вверх
    {x:309,y:314},{x:307,y:266},{x:306,y:224},{x:305,y:190},
    // верхние веточки
    {x:258,y:211},{x:215,y:184},
    {x:338,y:207},{x:395,y:174},
    // самая макушка
    {x:302,y:146}
  ];

  /* ============ Состояние ============ */
  const votes = { red:0, green:0, yellow:0 };
  let pool  = [];
  let round = 0;

  function refillPool(){
    round++;
    const jitter = round > 1 ? 1 : 0;         // начиная со 2-го круга — лёгкий разброс
    pool = SLOTS.map(function(s){
      return {
        x: s.x + (Math.random()*12 - 6) * jitter,
        y: s.y + (Math.random()*12 - 6) * jitter
      };
    });
    // перемешиваем
    for(let i = pool.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      const t = pool[i]; pool[i] = pool[j]; pool[j] = t;
    }
  }
  refillPool();

  /* ============ Звук (Web Audio API) ============ */
  let actx = null;
  function audio(){
    if(!actx){
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if(!Ctx) return null;
      actx = new Ctx();
    }
    if(actx.state === "suspended") actx.resume();
    return actx;
  }

  function beep(freq, delay, dur, type, vol){
    const ctx = audio();
    if(!ctx) return;
    const t = ctx.currentTime + delay;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type || "sine";
    osc.frequency.setValueAtTime(freq, t);
    osc.connect(gain);
    gain.connect(ctx.destination);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.linearRampToValueAtTime(vol, t + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.start(t);
    osc.stop(t + dur + 0.05);
  }

  const MELODY = {
    red:    [523.25, 659.25, 783.99, 1046.50],   // до-ми-соль-до — «ура!»
    green:  [587.33, 739.99, 880.00],            // ре-фа#-ля — спокойно
    yellow: [440.00, 523.25, 659.25]             // ля-до-ми — мягко
  };
  const TIMBRE = { red:"sine", green:"triangle", yellow:"sine" };

  function playSound(type){
    const notes = MELODY[type] || MELODY.red;
    const timbre = TIMBRE[type] || "sine";
    notes.forEach(function(f, i){
      beep(f, i * 0.09, 0.32, timbre, 0.16);
    });
  }

  function playPop(){
    beep(880, 0, 0.08, "square", 0.05);
    beep(1320, 0.05, 0.10, "sine", 0.05);
  }

  /* ============ Звёздочки ============ */
  const STAR_GLYPHS = ["⭐","✨","🌟","💫"];

  function spawnStars(x, y){
    const count = 12;
    for(let i = 0; i < count; i++){
      const s = document.createElement("div");
      s.className = "star";
      s.textContent = STAR_GLYPHS[i % STAR_GLYPHS.length];
      s.style.left = x + "px";
      s.style.top  = y + "px";
      document.body.appendChild(s);

      const ang  = Math.random() * Math.PI * 2;
      const dist = 60 + Math.random() * 130;
      const dx = Math.cos(ang) * dist;
      const dy = Math.sin(ang) * dist - 70 - Math.random() * 40;
      const sc = 0.8 + Math.random() * 0.9;
      const rot = (Math.random() * 720 - 360) | 0;

      (function(el, dx, dy, sc, rot, delay){
        setTimeout(function(){
          el.style.transform =
            "translate(-50%,-50%) translate(" + dx + "px," + dy + "px) scale(" + sc + ") rotate(" + rot + "deg)";
          el.style.opacity = "0";
        }, delay);
      })(s, dx, dy, sc, rot, i * 18);

      setTimeout(function(){ s.remove(); }, 1300 + i * 20);
    }
  }

  /* ============ Полёт плода к ветке ============ */
  function svgPointToScreen(x, y){
    const p = svg.createSVGPoint();
    p.x = x; p.y = y;
    const m = svg.getScreenCTM();
    if(!m) return { x: x, y: y };
    const s = p.matrixTransform(m);
    return { x: s.x, y: s.y };
  }

  function flyFruit(emoji, sx, sy, tx, ty, done){
    const el = document.createElement("div");
    el.className = "flyer";
    el.textContent = emoji;
    el.style.left = sx + "px";
    el.style.top  = sy + "px";
    document.body.appendChild(el);

    const dx = tx - sx;
    const dy = ty - sy;
    const rot = (Math.random() * 90 - 45) | 0;

    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        el.style.transform =
          "translate(-50%,-50%) translate(" + dx + "px," + dy + "px) scale(.62) rotate(" + rot + "deg)";
      });
    });

    setTimeout(function(){
      el.remove();
      if(typeof done === "function") done();
    }, 680);
  }

  /* ============ Появление плода на дереве ============ */
  function addFruit(type, slot){
    const g = document.createElementNS(NS, "g");
    const rot = (type === "yellow")
      ? (Math.random() * 70 - 35)
      : (Math.random() * 22 - 11);
    const sc = 0.9 + Math.random() * 0.25;

    g.setAttribute("transform",
      "translate(" + slot.x.toFixed(1) + " " + slot.y.toFixed(1) + ") " +
      "rotate(" + rot.toFixed(1) + ") scale(" + sc.toFixed(2) + ")");

    const t = document.createElementNS(NS, "text");
    t.setAttribute("text-anchor", "middle");
    t.setAttribute("dominant-baseline", "central");
    t.setAttribute("font-size", "34");
    t.setAttribute("class", "fruit-pop");
    t.textContent = EMOJI[type];

    g.appendChild(t);
    fruitsG.appendChild(g);
  }

  /* ============ Счётчики ============ */
  function plural(n){
    const n10 = n % 10, n100 = n % 100;
    if(n10 === 1 && n100 !== 11) return "ученик";
    if(n10 >= 2 && n10 <= 4 && (n100 < 10 || n100 >= 20)) return "ученика";
    return "учеников";
  }

  function updateCounters(bumped){
    ["red","green","yellow"].forEach(function(type){
      const box  = COUNTERS[type];
      const num  = box.querySelector(".num");
      const word = box.querySelector(".word");
      num.textContent  = votes[type];
      word.textContent = plural(votes[type]);

      if(type === bumped){
        num.classList.remove("bump");
        void num.offsetWidth;
        num.classList.add("bump");
        setTimeout(function(){ num.classList.remove("bump"); }, 200);
      }
    });
  }

  /* ============ Голосование ============ */
  function vote(btn){
    const type = btn.dataset.type;
    if(!type) return;

    const rect = btn.getBoundingClientRect();
    const sx = rect.left + rect.width / 2;
    const sy = rect.top  + rect.height / 2;

    if(pool.length === 0) refillPool();
    const slot = pool.pop();

    votes[type]++;
    updateCounters(type);

    playSound(type);
    spawnStars(sx, sy);

    const target = svgPointToScreen(slot.x, slot.y);
    flyFruit(EMOJI[type], sx, sy, target.x, target.y, function(){
      addFruit(type, slot);
      playPop();
    });
  }

  document.querySelectorAll(".vote-btn").forEach(function(btn){
    btn.addEventListener("click", function(){ vote(btn); });
  });

  /* ============ Сброс ============ */
  document.getElementById("reset").addEventListener("click", function(){
    votes.red = 0; votes.green = 0; votes.yellow = 0;

    // анимация «осыпания»
    const items = Array.prototype.slice.call(fruitsG.children);
    items.forEach(function(g, i){
      g.style.transition = "opacity .35s ease, transform .5s ease";
      g.style.transformOrigin = "center";
      setTimeout(function(){
        g.style.opacity = "0";
        g.setAttribute("transform", g.getAttribute("transform") + " translate(0 220) rotate(120)");
      }, i * 12);
    });
    setTimeout(function(){
      while(fruitsG.firstChild) fruitsG.removeChild(fruitsG.firstChild);
    }, 700);

    round = 0;
    refillPool();
    updateCounters(null);

    // короткий «сбросный» звук
    beep(660, 0, 0.14, "sine", 0.12);
    beep(440, 0.11, 0.22, "sine", 0.12);
  });

  /* ============ Первичная отрисовка счётчиков ============ */
  updateCounters(null);

  /* ============ Небольшая страховка: если окно меняет размер ============ */
  window.addEventListener("resize", function(){ /* координаты считаются в момент клика */ });

})();
</script>
</body>
</html>
